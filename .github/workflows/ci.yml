name: SICLIN PHP y PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Construir y arrancar sin credenciales externas
        run: ./scripts/dev-up.sh
      - name: PostgreSQL e integración real del motor PHP
        run: ./scripts/test.sh
      - name: Navegador, OTP SMTP local y permisos
        run: ./scripts/e2e.sh
      - name: Preparar demostración por roles
        run: ./scripts/demo-up.sh
      - name: Recorrido de escenarios, guardias y seguimiento
        env:
          SICLIN_DEMO_TEST: '1'
          SICLIN_E2E_URL: http://localhost:8010
        run: node tests/browser/node_modules/playwright/cli.js test --config tests/browser/playwright.config.js
      - name: Diagnóstico de infraestructura
        run: ./scripts/diagnose.sh
      - name: Estado final de contenedores
        if: always()
        run: docker compose ps -a
